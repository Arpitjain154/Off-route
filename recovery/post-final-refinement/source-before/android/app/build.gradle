import com.android.build.api.instrumentation.AsmClassVisitorFactory
import com.android.build.api.instrumentation.ClassContext
import com.android.build.api.instrumentation.ClassData
import com.android.build.api.instrumentation.InstrumentationParameters
import com.android.build.api.instrumentation.InstrumentationScope
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes

apply plugin: 'com.android.application'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST'] } }
    namespace "com.idr.navigator"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.idr.navigator"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "1.5.6-offroute"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (System.getenv('IDR_KEYSTORE_PATH')) {
            production {
                storeFile file(System.getenv('IDR_KEYSTORE_PATH'))
                storePassword System.getenv('IDR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('IDR_KEY_ALIAS')
                keyPassword System.getenv('IDR_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        laptopTrial {
            initWith debug
            applicationIdSuffix '.candidate'
            versionNameSuffix '-candidate-test'
            matchingFallbacks = ['debug']
        }
        release {
            if (System.getenv('IDR_KEYSTORE_PATH')) signingConfig signingConfigs.production
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.laptopTrial.assets.srcDir file('../../artifacts/laptop-agent/trial-assets')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.5'
    testImplementation 'org.json:json:20240303'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'org.ejml:ejml-simple:0.43.1'
    implementation 'com.graphhopper:graphhopper-core:7.0'
    implementation 'com.graphhopper:graphhopper-map-matching:7.0'
    // Google's maintained TFLite runtime; retains org.tensorflow.lite.Interpreter.
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'org.slf4j:slf4j-android:1.7.36'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.slf4j:slf4j-simple:1.7.36'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// GraphHopper 7 calls a compiler API that Android does not ship. Replace exactly
// one keyword-check call; preserve the upstream code and on-disk graph format.
abstract class GraphHopperAndroidVisitor implements AsmClassVisitorFactory<InstrumentationParameters.None> {
    @Override boolean isInstrumentable(ClassData data) {
        return data.className == 'com.graphhopper.routing.ev.IntEncodedValueImpl'
    }
    @Override ClassVisitor createClassVisitor(ClassContext context, ClassVisitor next) {
        return new ClassVisitor(Opcodes.ASM9, next) {
            int replacements = 0
            @Override MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                def downstream = super.visitMethod(access, name, descriptor, signature, exceptions)
                return new MethodVisitor(Opcodes.ASM9, downstream) {
                    @Override void visitMethodInsn(int opcode, String owner, String method, String desc, boolean itf) {
                        if (owner == 'javax/lang/model/SourceVersion' && method == 'isKeyword' && desc == '(Ljava/lang/CharSequence;)Z') {
                            replacements++
                            super.visitMethodInsn(opcode, 'com/idr/navigator/compat/JavaKeywords', method, desc, itf)
                        } else super.visitMethodInsn(opcode, owner, method, desc, itf)
                    }
                }
            }
            @Override void visitEnd() {
                if (replacements != 1) throw new GradleException('GraphHopper keyword patch expected one call; found ' + replacements)
                super.visitEnd()
            }
        }
    }
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.instrumentation.transformClassesWith(GraphHopperAndroidVisitor, InstrumentationScope.ALL) {}
}

// JVM tests use a real JVM logger; android.util.Log is only available on a phone.
configurations.matching { it.name.contains('UnitTest') }.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j-android'
}
tasks.withType(Test).configureEach {
    if (System.getenv('IDR_BUILD_STATE_GRAPH') == '1') maxHeapSize = '3g'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

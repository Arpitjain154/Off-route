name: idr-navigator
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: idr
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://idr:${MONGO_PASSWORD:?Set MONGO_PASSWORD}@mongo:27017/idr_navigator?authSource=admin
      API_KEY: ${API_KEY:?Set API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      CORS_ORIGINS: https://localhost,https://${DOMAIN:?Set DOMAIN}
      TRUST_PROXY_HOPS: 1
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  mongo-data:
  uploads:
  caddy-data:
  caddy-config:
